version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: zomato-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zomato_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - zomato-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/zomato_db --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zomato-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017/zomato_db
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - zomato-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zomato-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zomato-network

volumes:
  mongodb_data:

networks:
  zomato-network:
    driver: bridge
