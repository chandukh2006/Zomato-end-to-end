version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: zomato-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zomato_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - zomato-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zomato-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017/zomato_db
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-minimum-32-chars-change-in-production}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    depends_on:
      - mongodb
    networks:
      - zomato-network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zomato-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_API_KEY}
    depends_on:
      - backend
    networks:
      - zomato-network

volumes:
  mongodb_data:

networks:
  zomato-network:
    driver: bridge
